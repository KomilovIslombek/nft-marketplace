# Runs the backend integration tests on every push and pull request.
# No secrets needed: the tests start their own in-memory MongoDB
# (mongodb-memory-server), so CI never touches a real database.
name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep the downloaded mongod outside node_modules so it can be cached
      # between runs (npm ci wipes node_modules every time).
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json

      - run: npm ci

      # The mongod binary mongodb-memory-server downloads on first use.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('back/package-lock.json') }}

      - run: npm test
